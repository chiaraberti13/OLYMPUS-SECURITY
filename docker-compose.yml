# Root-level orchestration for the COMPLETE Vulnerability Assessment Platform.
#
# One command brings up the whole stack:
#
#     docker compose up --build
#
# Services:
#   * redis    — broker + result backend + API cache for Celery/async scans
#   * aegis-migrate — one-shot: applies the Alembic database migrations, then exits
#   * aegis-app     — the complete AEGIS FastAPI web application (~40 routes, 24 scanners)
#   * aegis-worker  — the Celery worker that actually runs queued scans
#
# The FastAPI app and the Celery worker are built from the complete vendored
# upstream source (vendor/vulnerability-assessment-platform) using its own
# Dockerfile, so nothing about the tool is reduced or reimplemented here.
#
# `olympus aegis serve|migrate|workers|scanners|deps|doctor` remains available
# as the native (non-container) entry point — see README.md / README-IT.md.

x-vap-build: &vap-build
  context: ./vendor/vulnerability-assessment-platform
  dockerfile: Dockerfile

x-vap-env: &vap-env
  # Database: a single SQLite file shared across services on the data volume.
  # For higher concurrency, point VAP_DATABASE_URL at PostgreSQL instead.
  VAP_DATABASE_URL: "sqlite:////data/vap.db"
  VAP_REPORTS_DIR: "/data/reports"
  # Redis wiring (broker db 0, results db 1, API cache db 2).
  VAP_CELERY_BROKER_URL: "redis://redis:6379/0"
  VAP_CELERY_RESULT_BACKEND: "redis://redis:6379/1"
  VAP_API_CACHE_ENABLED: "true"
  VAP_API_CACHE_REDIS_URL: "redis://redis:6379/2"
  # The container listens on all interfaces inside its isolated network, while
  # the host publication below is deliberately loopback-only. The legacy VAP
  # web surface must not be exposed directly to a LAN or the Internet.
  VAP_HOST: "0.0.0.0"
  VAP_PORT: "8000"
  VAP_REQUIRE_HTTPS: "false"
  # Live scans stay OFF by default (safe default). Set to "true" only with
  # documented authorization and the scanner binaries installed.
  VAP_ENABLE_LIVE_SCANS: "${VAP_ENABLE_LIVE_SCANS:-false}"

# Baseline container hardening applied to every service (roadmap §5.3). These are
# the runtime-safe controls: no privilege escalation, all Linux capabilities
# dropped (a Python web app / broker needs none to bind its high ports), and
# conservative memory/PID caps so one runaway container cannot starve the host.
# NOTE: read_only rootfs and a non-root `user:` are deliberately NOT set here —
# they require validation against the vendored VAP image's writable paths and
# volume ownership on a real Docker host, which is tracked as open in
# ROADMAP_HARDENING.md (§5.3). Everything below is safe without that validation.
x-hardening: &hardening
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - "ALL"
  pids_limit: 512
  mem_limit: 1g
  networks:
    - backend

services:
  redis:
    <<: *hardening
    # Mandatory broker, pinned by digest for a reproducible stack.
    # Refresh with: docker manifest inspect redis:7-alpine
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    # Not published to the host by default (keeps the broker off your LAN).
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  aegis-migrate:
    <<: *hardening
    build: *vap-build
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: *vap-env
    volumes:
      - vap-data:/data
    restart: "no"

  aegis-app:
    <<: *hardening
    build: *vap-build
    command: ["python", "app.py"]
    environment: *vap-env
    ports:
      - "127.0.0.1:${VAP_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      aegis-migrate:
        condition: service_completed_successfully
    volumes:
      - vap-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  aegis-worker:
    <<: *hardening
    build: *vap-build
    command: ["celery", "-A", "celery_app.celery_app", "worker", "--loglevel=info", "-Q", "scans"]
    environment: *vap-env
    depends_on:
      redis:
        condition: service_healthy
      aegis-migrate:
        condition: service_completed_successfully
    volumes:
      - vap-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "-A", "celery_app.celery_app", "inspect", "ping", "-d", "celery@$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


  # The optional engines below start ONLY under an explicit --profile, so their
  # floating tags never affect the default stack; pin them in your own deployment
  # if you need a reproducible engine version.
  #
  # --- OWASP ZAP (open source, Apache-2.0) — long-running daemon with an API.
  #     Enable with:  docker compose --profile zap up
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: ["zap", "scanners-cli"]
    # The API key is mandatory: AEGIS_ZAP_API_KEY must be set (no unauthenticated
    # ZAP API). ZAP gets its own hardening but not the shared 1g memory cap — it
    # needs more headroom than the Python services.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - "ALL"
    networks:
      - backend
    command:
      - "zap.sh"
      - "-daemon"
      - "-host"
      - "0.0.0.0"
      - "-port"
      - "8090"
      - "-config"
      - "api.key=${AEGIS_ZAP_API_KEY:?set AEGIS_ZAP_API_KEY to a strong secret}"
    expose:
      - "8090"
    restart: unless-stopped

  # --- OpenVAS / Greenbone GVM (open source, GPL-2.0). The full stack is several
  #     services (gvmd, ospd-openvas, notus, feeds, gsa); this is the community
  #     manager entrypoint. For the complete stack use Greenbone's official
  #     greenbone-community-container compose. Enable with:  docker compose --profile gvm up
  gvm:
    image: greenbone/gvmd:stable
    profiles: ["gvm"]
    restart: unless-stopped
    volumes:
      - gvm-data:/var/lib/gvm

  # --- Commercial connectors (proprietary licences required; images are
  #     operator-provided). Enable with:  docker compose --profile commercial-connectors up
  nessus:
    image: ${AEGIS_NESSUS_IMAGE:-tenableofficial/nessus:latest}
    profiles: ["commercial-connectors"]
    environment:
      # Provide your own licence/activation via env (never commit these).
      ACTIVATION_CODE: "${NESSUS_ACTIVATION_CODE:-}"
    expose:
      - "8834"
    restart: unless-stopped
    # NOTE: Burp Suite Professional and Acunetix have no redistributable image;
    # run them externally and point AEGIS at their APIs (see docs/scanner-matrix.md).

networks:
  # A dedicated bridge for the core control plane (broker, migrate, app, worker,
  # and the ZAP engine) so it is isolated from other Compose projects' default
  # network. Full control-plane / scan-plane segmentation across the scanner
  # overlay (docker-compose.scanners.yml) still needs validation on a Docker host
  # — see ROADMAP_HARDENING.md §5.3.
  backend:
    driver: bridge

volumes:
  vap-data:
  redis-data:
  gvm-data:
