[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olympus-security"
version = "0.2.0"
description = "Olympus — an offensive-security platform (Red + Blue) with a shared data contract."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Olympus Security" }]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "dnspython>=2.6",
    "phonenumbers>=8.13",
    "rich>=13.0",
    "textual>=0.85",
    # Authenticated symmetric encryption for sensitive CTI at rest (Metis §2).
    # A vetted library, not hand-rolled crypto: Fernet (AES-128-CBC + HMAC) with
    # an scrypt KDF.
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "httpx>=0.27",
    "hypothesis>=6.98",
]
api = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
]
# AEGIS — the vendored Vulnerability Assessment Platform (complete upstream app
# under vendor/vulnerability-assessment-platform). See that directory's
# requirements.txt for the full pinned set; this extra pulls the core web/DB/
# worker stack so `olympus aegis serve|workers` run. External scanner *binaries*
# (nmap, nuclei, sqlmap, ...) are installed separately — see
# vendor/.../installer.sh, docker/Dockerfile.scanners, or `olympus aegis deps`.
aegis = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "celery>=5.3",
    "redis>=5.0",
    "prometheus-client>=0.19",
    "structlog>=24.1",
    "slowapi>=0.1.9",
    "requests>=2.32",
    "validators>=0.22",
    "itsdangerous>=2.1",
]
# Deprecated alias for the AEGIS extra (kept for backward compatibility).
vap = [
    "olympus-security[aegis]",
]

[project.scripts]
olympus = "olympus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/olympus"]

# ---------------------------------------------------------------------------
# Quality tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Vendored upstream tools are preserved verbatim and held to their own quality
# gates, not Olympus's. Exclude them from lint/format here.
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "PTH", "RUF"]
# S101 (assert) is fine in tests; handled per-file below.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.isort]
known-first-party = ["olympus"]

# Mypy is an additional local quality tool. Ruff and pytest are blocking CI
# checks. Vendored upstream tools are excluded; they carry their own tooling.
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["olympus"]
warn_unused_configs = true
exclude = ['^vendor/']

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Pytest is a blocking CI check. Coverage reporting currently has no threshold.
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["olympus"]
