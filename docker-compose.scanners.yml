# Override: build the app/worker/migrate images WITH open-source scanner
# binaries (docker/Dockerfile.scanners) instead of the python-only default.
#
#     docker compose -f docker-compose.yml -f docker-compose.scanners.yml up --build
#
# The build context is the complete vendored VAP source; only the Dockerfile
# changes, so the platform itself is unmodified.
services:
  themis-migrate:
    build:
      context: ./vendor/vulnerability-assessment-platform
      dockerfile: ../../docker/Dockerfile.scanners
  themis-app:
    build:
      context: ./vendor/vulnerability-assessment-platform
      dockerfile: ../../docker/Dockerfile.scanners
  themis-worker:
    build:
      context: ./vendor/vulnerability-assessment-platform
      dockerfile: ../../docker/Dockerfile.scanners
