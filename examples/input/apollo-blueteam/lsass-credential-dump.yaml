schema_name: olympus.apollo-rule
schema_version: 1.0.0
rule_id: APL-BT-LSASS-DUMP
title: LSASS memory access by non-system process (credential dumping)
event_type: windows.sysmon
conditions:
  event_id: "10"
  target_image: C:\Windows\System32\lsass.exe
  granted_access: "0x1410"
  source_is_system: "false"
severity: critical
mitre_attack:
  - T1003.001
