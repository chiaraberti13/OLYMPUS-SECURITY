[engine]
name = "wafw00f"
category = "web"
upstream = "https://github.com/EnableSecurity/wafw00f"
upstream_verified = false
language = "Python"
license = "BSD-3-Clause"
distribution = "pip"
pinned_version = "2.4.2"
evidence_version = "2.x"
update_policy = "minor"
mandatory = false
presence_probe = ["wafw00f", "--version"]
capability = "web.waf"

[engine.source]
package = "wafw00f"

[adapter]
entrypoint = "olympus.themis.adapters.wafw00f:Wafw00fAdapter"
timeout_seconds = 300
resource_profile = "light"
reviewed = false  # TODO(TOOLS-4): review in Fase 2, values are estimates
