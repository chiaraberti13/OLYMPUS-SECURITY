[engine]
name = "nuclei"
category = "web"
upstream = "https://github.com/projectdiscovery/nuclei"
upstream_verified = false
language = "Go"
license = "MIT"
distribution = "go"
pinned_version = "v3.11.1"
evidence_version = "v3.11.1"
update_policy = "minor"
mandatory = true
presence_probe = ["nuclei", "-version"]
capability = "web.scan"
requires_data = ["nuclei-templates"]

[engine.source]
module = "github.com/projectdiscovery/nuclei/v3/cmd/nuclei"

[adapter]
entrypoint = "olympus.themis.adapters.nuclei:NucleiAdapter"
timeout_seconds = 600
resource_profile = "network-heavy"
# The only flags the adapter may pass. -target and -templates take one runtime value each;
# everything else is fixed. -omit-raw keeps session material out of evidence, -no-interactsh
# forbids third-party callbacks, -disable-update-check forbids reaching out mid-scan.
value_flags = ["-target", "-templates"]
optional_flags = ["-templates"]
static_flags = ["-jsonl", "-silent", "-no-color", "-disable-update-check", "-no-interactsh", "-omit-raw", "-omit-template"]
reviewed = false  # TODO(TOOLS-4): review in Fase 2, values are estimates
