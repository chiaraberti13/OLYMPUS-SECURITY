name: codeql

# Static application security testing (SAST) for the first-party Python code
# (ROADMAP SEC-F). Results are uploaded to GitHub code scanning; make this a
# required check in branch protection to turn it into a blocking gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so newly published queries catch already-merged code.
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL · Python · security-extended
    runs-on: ubuntu-latest
    permissions:
      # Minimal privileges: read the tree, read Actions metadata, and write the
      # code-scanning alerts CodeQL produces. Nothing else.
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          # Pull in the security-and-quality pack, not just the default queries,
          # so injection/SSRF/path-traversal classes are covered.
          queries: security-extended,security-and-quality
      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
