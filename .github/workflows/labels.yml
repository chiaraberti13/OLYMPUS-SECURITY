name: repository labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/workflows/labels.yml
      - tools/sync_labels.py
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: validate · create · update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Synchronize managed labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/sync_labels.py
          --repository "$GITHUB_REPOSITORY"
          --token "$GITHUB_TOKEN"
          .github/labels.json
