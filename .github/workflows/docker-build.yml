name: scanner-image

# The scanner image has pinned, fail-closed installs (docker/Dockerfile.scanners).
# That only means something if it actually builds, so this job builds it on every
# push and pull request that can change what goes into it, then proves each
# engine is really there with its manifest probe and pinned commit.
on:
  push:
    paths: &image_paths
      - docker/**
      - src/olympus/engines/**
      - src/olympus/themis/**
      - scripts/smoke_scanner_image.py
      - pyproject.toml
      - .github/workflows/docker-build.yml
  pull_request:
    paths: *image_paths
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes an unfinished build of this slow image.
concurrency:
  group: scanner-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build · engine smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 90   # nmap and the Go engines are compiled from source
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Olympus (manifest loader for the smoke test)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Build the scanner image
        run: docker build --progress=plain -f docker/Dockerfile.scanners -t olympus-scanners:ci .
      - name: Every shipped engine is present at its pinned version
        run: python scripts/smoke_scanner_image.py olympus-scanners:ci
