name: scanner-image

# The scanner image has pinned, fail-closed installs (docker/Dockerfile.scanners).
# That only means something if it actually builds, so this job builds it for every
# change that can affect it, then proves each engine is really present. On main the
# lightweight gate always runs, while the expensive build remains path-selective.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes an unfinished build of this slow image.
concurrency:
  group: scanner-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.paths.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          required=true
          if [[ "$EVENT" == pull_request || "$EVENT" == push ]]; then
            git diff --name-only --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/scanner-paths"
            required=false
            while IFS= read -r -d '' path; do
              case "$path" in
                docker/*|src/olympus/engines/*|src/olympus/themis/*|scripts/smoke_scanner_image.py|pyproject.toml|.github/workflows/docker-build.yml)
                  required=true
                  break
                  ;;
              esac
            done < "$RUNNER_TEMP/scanner-paths"
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    name: build · engine smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 90   # nmap and the Go engines are compiled from source
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Olympus (manifest loader for the smoke test)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Build the scanner image
        run: docker build --progress=plain -f docker/Dockerfile.scanners -t olympus-scanners:ci .
      - name: Every shipped engine is present at its pinned version
        run: python scripts/smoke_scanner_image.py olympus-scanners:ci

      - name: Strict diagnostics on the built image without network access
        run: docker run --rm --network none olympus-scanners:ci engines doctor --strict

      - name: Mandatory engine refusal in an offline disposable container
        run: |
          docker run --rm --network none --user 0 --entrypoint sh olympus-scanners:ci -ec '
            nmap_path=$(command -v nmap)
            test -x "$nmap_path"
            rm -- "$nmap_path"
            ! command -v nmap
            status=0
            setpriv --reuid=10001 --regid=10001 --clear-groups env HOME=/tmp \
              olympus engines preflight --format json > /tmp/report.json || status=$?
            test "$status" -eq 8
            status=0
            setpriv --reuid=10001 --regid=10001 --clear-groups env HOME=/tmp \
              olympus engines doctor --strict --format json > /tmp/doctor.json || status=$?
            test "$status" -eq 8
            echo "["
            cat /tmp/report.json
            echo ","
            cat /tmp/doctor.json
            echo "]"
          ' > "$RUNNER_TEMP/diagnostics.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from olympus.engines.doctor import EngineDoctorReport

          report, raw_doctor = json.loads((Path(os.environ["RUNNER_TEMP"]) / "diagnostics.json").read_text())
          assert raw_doctor["schema_name"] == "olympus.engine-doctor"
          assert raw_doctor["schema_version"] == "1.0.0"
          doctor = EngineDoctorReport.model_validate(raw_doctor)
          assert doctor.exit_code == 8 and "nmap" in doctor.blocking
          assert any(e.name == "nmap" and e.state == "missing" for e in doctor.engines)
          assert report["ready"] is False and report["exit_code"] == 8
          assert any(e["name"] == "nmap" and e["state"] == "missing" for e in report["blocking"])
          print("Verified mandatory nmap refusal in a network-isolated container.")
          PY

      - name: Reject changed engine and template commits offline
        run: |
          docker run --rm --network none --user 0 --entrypoint sh olympus-scanners:ci -ec '
            for checkout in /opt/nmap /opt/nuclei-templates; do
              git -C "$checkout" -c user.name=T5 -c user.email=t5@example.invalid \
                -c commit.gpgSign=false commit --allow-empty -qm "T5 diagnostic fixture"
            done
            status=0
            setpriv --reuid=10001 --regid=10001 --clear-groups env HOME=/tmp \
              olympus engines doctor --strict --engine nmap --engine nuclei --format json || status=$?
            test "$status" -eq 8
          ' > "$RUNNER_TEMP/changed-commits.json"
          python - <<'PYTHON'
          import os
          from pathlib import Path
          from olympus.engines.doctor import EngineDoctorReport

          report = EngineDoctorReport.model_validate_json(
              (Path(os.environ["RUNNER_TEMP"]) / "changed-commits.json").read_bytes()
          )
          assert report.exit_code == 8 and set(report.blocking) == {"nmap", "nuclei"}
          states = {engine.name: engine.state for engine in report.engines}
          assert states == {"nmap": "commit-mismatch", "nuclei": "data-problem"}
          PYTHON

  gate:
    name: scanner-image gate
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    env:
      DETECTION: ${{ needs.changes.result }}
      REQUIRED: ${{ needs.changes.outputs.required }}
      BUILD: ${{ needs.build.result }}
    steps:
      - name: Verify scanner image policy
        run: |
          [[ "$DETECTION" == success ]] || exit 1
          case "$REQUIRED:$BUILD" in
            true:success|false:skipped) exit 0 ;;
            *) echo "Unexpected scanner build state: $REQUIRED:$BUILD"; exit 1 ;;
          esac
