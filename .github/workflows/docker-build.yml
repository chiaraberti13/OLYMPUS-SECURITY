name: scanner-image

# The scanner image has pinned, fail-closed installs (docker/Dockerfile.scanners).
# That only means something if it actually builds, so this job builds it on every
# push and pull request that can change what goes into it, then proves each
# engine is really there with its manifest probe and pinned commit.
on:
  push:
    paths:
      - docker/**
      - src/olympus/engines/**
      - src/olympus/themis/**
      - scripts/smoke_scanner_image.py
      - pyproject.toml
      - .github/workflows/docker-build.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes an unfinished build of this slow image.
concurrency:
  group: scanner-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.paths.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          required=true
          if [[ "$EVENT" == pull_request ]]; then
            git diff --name-only --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/scanner-paths"
            required=false
            while IFS= read -r -d '' path; do
              case "$path" in
                docker/*|src/olympus/engines/*|src/olympus/themis/*|scripts/smoke_scanner_image.py|pyproject.toml|.github/workflows/docker-build.yml)
                  required=true
                  break
                  ;;
              esac
            done < "$RUNNER_TEMP/scanner-paths"
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    name: build · engine smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 90   # nmap and the Go engines are compiled from source
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Olympus (manifest loader for the smoke test)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Build the scanner image
        run: docker build --progress=plain -f docker/Dockerfile.scanners -t olympus-scanners:ci .
      - name: Every shipped engine is present at its pinned version
        run: python scripts/smoke_scanner_image.py olympus-scanners:ci

  gate:
    name: scanner-image gate
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    env:
      DETECTION: ${{ needs.changes.result }}
      REQUIRED: ${{ needs.changes.outputs.required }}
      BUILD: ${{ needs.build.result }}
    steps:
      - name: Verify scanner image policy
        run: |
          [[ "$DETECTION" == success ]] || exit 1
          case "$REQUIRED:$BUILD" in
            true:success|false:skipped) exit 0 ;;
            *) echo "Unexpected scanner build state: $REQUIRED:$BUILD"; exit 1 ;;
          esac
